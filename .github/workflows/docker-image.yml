name: FastAPI CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Check Python
        run: python --version
      
      - name: Check uv
        run: python -m uv --version
      
      - name: Install dependencies
        run: python -m uv sync --locked
      
      # - name: Lint
      #   run: python -m uv run ruff check .
      
      - name: Run tests
        run: python -m uv run pytest
      - name: Build Docker image
        run: docker build -t fastapi-app:latest .

      - name: Start container
        shell: pwsh
        run: |
          docker rm -f fastapi-app 2>$null
          docker run -d --name fastapi-app -p 8080:8080 fastapi-app:latest

      - name: Wait for application
        shell: pwsh
        run: Start-Sleep -Seconds 5

      - name: Health check
        shell: pwsh
        run: |
          $response = Invoke-WebRequest http://localhost:8080/health
          if ($response.StatusCode -ne 200) {
            throw "Health check failed"
          }

      - name: Show running containers
        if: always()
        run: docker ps -a

      - name: Cleanup
        if: always()
        run: docker rm -f fastapi-app
