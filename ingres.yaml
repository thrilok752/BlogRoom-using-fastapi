apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: application-ingress
  labels:
    app.kubernetes.io/name: application-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: api.blogroom.com
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: application-service
            port: 
              number: 8080
