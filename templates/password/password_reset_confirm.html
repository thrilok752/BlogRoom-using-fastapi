{% extends "base.html" %}

{% block title %}
Set New Password
{% endblock %}

{% block content %}

<div class="content-section">

    <form id="resetPasswordForm">

        <fieldset class="form-group">

            <legend class="border-bottom mb-4">
                Set New Password
            </legend>

            <div id="div_id_new_password1" class="form-group">

                <label for="id_new_password1" class="requiredField">
                    New password<span class="asteriskField">*</span>
                </label>

                <div>
                    <input
                        type="password"
                        name="new_password1"
                        autocomplete="new-password"
                        class="passwordinput form-control"
                        required
                        minlength="8"
                        id="id_new_password1">

                    <small class="form-text text-muted">
                        Your password must contain at least 8 characters.
                    </small>
                </div>

            </div>

            <div id="div_id_new_password2" class="form-group">

                <label for="id_new_password2" class="requiredField">
                    New password confirmation<span class="asteriskField">*</span>
                </label>

                <div>
                    <input
                        type="password"
                        name="new_password2"
                        autocomplete="new-password"
                        class="passwordinput form-control"
                        required
                        minlength="8"
                        id="id_new_password2">

                    <small class="form-text text-muted">
                        Enter the same password as before, for verification.
                    </small>
                </div>

            </div>

        </fieldset>

        <div id="resetError"
             class="text-danger mt-3 d-none">
        </div>

        <div class="form-group mt-3">

            <button
                class="btn btn-outline-info"
                type="submit">

                Update Password

            </button>

        </div>

    </form>

</div>

{% endblock %}
{% block script %}

<script>

const resetPasswordForm =
    document.getElementById("resetPasswordForm");

const newPassword =
    document.getElementById("id_new_password1");

const confirmPassword =
    document.getElementById("id_new_password2");

const resetError =
    document.getElementById("resetError");


const params = new URLSearchParams(window.location.search);

const token = params.get("token");

resetPasswordForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    resetError.classList.add("d-none");


    if (!token) {
        resetError.textContent = "Invalid password reset link.";
        resetError.classList.remove("d-none");
        return;
    }


    if (newPassword.value !== confirmPassword.value) {
        resetError.textContent = "Passwords do not match.";
        resetError.classList.remove("d-none");
        return;
    }
        const userData = {
        token: token,
        new_password: newPassword.value
    };
        try {

        const response = await fetch(
            "/api/users/reset-password",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(userData)
            }
        );


        if (response.ok) {

            window.location.href = "/password-reset-complete";

        } else {

            const error = await response.json();

            resetError.textContent =
                error.detail || "Unable to reset password.";

            resetError.classList.remove("d-none");
        }

    } catch (error) {

        resetError.textContent =
            "Network error. Please try again.";

        resetError.classList.remove("d-none");
    }

});

</script>

{% endblock %}
