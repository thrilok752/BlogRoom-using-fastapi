{% extends "base.html" %}

{% block content %}

<div class="content-section">

    <form id="changePasswordForm">

        <fieldset class="form-group">

            <legend class="border-bottom mb-4">
                Change Password
            </legend>

            <div id="div_id_old_password" class="form-group">

                <label for="id_old_password" class="requiredField">
                    Old password<span class="asteriskField">*</span>
                </label>

                <div>
                    <input
                        type="password"
                        name="old_password"
                        autocomplete="current-password"
                        autofocus
                        class="passwordinput form-control"
                        required
                        id="id_old_password">
                </div>

            </div>


            <div id="div_id_new_password1" class="form-group">

                <label for="id_new_password1" class="requiredField">
                    New password<span class="asteriskField">*</span>
                </label>

                <div>
                    <input
                        type="password"
                        name="new_password1"
                        autocomplete="new-password"
                        class="passwordinput form-control"
                        required
                        minlength="8"
                        id="id_new_password1">

                    <small class="form-text text-muted">
                        Your password must contain at least 8 characters.
                    </small>
                </div>

            </div>


            <div id="div_id_new_password2" class="form-group">

                <label for="id_new_password2" class="requiredField">
                    New password confirmation<span class="asteriskField">*</span>
                </label>

                <div>
                    <input
                        type="password"
                        name="new_password2"
                        autocomplete="new-password"
                        class="passwordinput form-control"
                        required
                        minlength="8"
                        id="id_new_password2">

                    <small class="form-text text-muted">
                        Enter the same password as before, for verification.
                    </small>
                </div>

            </div>

        </fieldset>


        <div id="passwordError"
             class="text-danger mt-3 d-none">
        </div>


        <div class="form-group mt-3">

            <button
                class="btn btn-outline-info"
                type="submit">

                Change Password

            </button>

        </div>

    </form>

</div>

{% endblock %}
{% block script %}

<script>

const changePasswordForm =
    document.getElementById("changePasswordForm");

const oldPassword =
    document.getElementById("id_old_password");

const newPassword =
    document.getElementById("id_new_password1");

const confirmPassword =
    document.getElementById("id_new_password2");

const passwordError =
    document.getElementById("passwordError");

changePasswordForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    passwordError.classList.add("d-none");


    if (newPassword.value !== confirmPassword.value) {

        passwordError.textContent =
            "New passwords do not match.";

        passwordError.classList.remove("d-none");

        return;
    }
    const token = localStorage.getItem("access_token");
    const userData = {
        current_password: oldPassword.value,
        new_password: newPassword.value
    };
        try {

        const response = await fetch(
            "/api/users/me/password",
            {
                method: "PATCH",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },

                body: JSON.stringify(userData)
            }
        );


        if (response.ok) {

            window.location.href = "/password-change-done";

        } else {

            const error = await response.json();

            passwordError.textContent =
                error.detail || "Unable to change password.";

            passwordError.classList.remove("d-none");
        }

    } catch (error) {

        passwordError.textContent =
            "Network error. Please try again.";

        passwordError.classList.remove("d-none");
    }

});

</script>

{% endblock %}
