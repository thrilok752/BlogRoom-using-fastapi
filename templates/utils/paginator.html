
{% if total_pages > 1 %}

<div class="mt-4">

    {% if page > 1 %}

        <a class="btn btn-outline-info mb-4"
           href="?page=1">
            First
        </a>

        <a class="btn btn-outline-info mb-4"
           href="?page={{ page - 1 }}">
            Previous
        </a>

    {% endif %}

    {% for num in range(1, total_pages + 1) %}

    {% if num == page %}

        <a class="btn btn-info mb-4"
           href="?page={{ num }}">
            {{ num }}
        </a>

    {% elif num > page - 3 and num < page + 3 %}

        <a class="btn btn-outline-info mb-4"
           href="?page={{ num }}">
            {{ num }}
        </a>

    {% endif %}

{% endfor %}


    {% if page < total_pages %}

        <a class="btn btn-outline-info mb-4"
           href="?page={{ page + 1 }}">
            Next
        </a>

        <a class="btn btn-outline-info mb-4"
           href="?page={{ total_pages }}">
            Last
        </a>

    {% endif %}

</div>

{% endif %}
